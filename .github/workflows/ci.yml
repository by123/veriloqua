name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Types (mypy)
        run: mypy src/veriloqua
      - name: Tests
        run: pytest
        env:
          VERILOQUA_NO_THIRD_PARTY: "0"

  wheel-install:
    # a REAL wheel install into a clean environment, then import + CLI smoke —
    # catches missing package data (prompts/, schema.sql) and entry-point breakage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Install wheel into a clean venv and smoke-test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/vq --version
          /tmp/clean/bin/python -m veriloqua --version
          /tmp/clean/bin/python - <<'EOF'
          import veriloqua
          from veriloqua.engine.prompt_assembly import _load_prompt
          # packaged prompt files and schema must ship inside the wheel
          assert "prompt file missing" not in _load_prompt("system_translator_fast.md")
          from veriloqua.memory.store_sqlite import SqliteMemoryStore
          SqliteMemoryStore(":memory:").stats()
          print("wheel smoke OK")
          EOF
